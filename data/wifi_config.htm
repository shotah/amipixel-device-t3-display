<!DOCTYPE html>
<html>

<head>
    <title>WiFi Configuration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/wifi_config.js"></script>
</head>

<body>
    <div class="container">
        <h1>WiFi Configuration</h1>
        <form method="post" action="/config">
            <label for="ssid">WiFi Network (SSID):</label>
            <select id="ssid" name="ssid" required>
                <option value="" disabled selected>Select WiFi Network</option>
            </select>

            <button type="button" id="scanButton">Scan for Networks</button>

            <label for="password">Password:</label>
            <div class="password-container">
                <input type="password" id="password" name="password">
                <span id="password-toggle" class="password-toggle">
                    <div id="eye-icon"
                        style="width: 23px; height: 20px; background-image: url('img/eye-closed.png'); background-size: contain; background-repeat: no-repeat;">
                    </div>
                </span>
            </div>


            <input type="submit" value="Connect">
        </form>
        <div id="error" class="error" style="display:none;"></div>
        <div id="success" class="success" style="display:none;"></div>
    </div>
</body>

</html>
